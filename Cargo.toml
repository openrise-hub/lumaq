[workspace]
members = [
    "crates/lumaq-core",
    "crates/lumaq-capture",
    "crates/lumaq-audio",
    "crates/lumaq-encoder",
    "crates/lumaq-overlay",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenRise Hub <dev@openrise.org>"]
license = "MIT"
repository = "https://github.com/openrise-hub/lumaq"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
